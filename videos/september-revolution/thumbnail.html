<style>

  @font-face{font-family:'Cairo';font-weight:200 1000;src:url(fonts/Cairo-latin.woff2) format('woff2');unicode-range:U+0000-00FF;}

  @font-face{font-family:'Amiri';font-weight:400;src:url(fonts/Amiri-latin-400.woff2) format('woff2');unicode-range:U+0000-00FF;}
  :root{--red:#CE1126;--paper:#F4F1EA;}
  html,body{margin:0;padding:0;background:#000;}
  body{width:1080px;height:1920px;overflow:hidden;color:var(--paper);
       font-family:'Cairo',sans-serif;-webkit-font-smoothing:antialiased;}
  #s{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0B0B0E;}
  .abs{position:absolute;inset:0;}
  #glow{background:radial-gradient(ellipse 74% 40% at 50% 50%, rgba(206,17,38,.42) 0%, rgba(206,17,38,0) 70%);}
  #rays{left:-60%;top:-40%;width:220%;height:180%;transform:rotate(14deg);
     background:conic-gradient(from 0deg, transparent 0deg, rgba(255,255,255,.06) 7deg, transparent 15deg,
       transparent 34deg, rgba(255,255,255,.045) 41deg, transparent 49deg,
       transparent 68deg, rgba(255,255,255,.055) 75deg, transparent 83deg);}
  #mapbg{position:absolute;left:0;top:1010px;width:1080px;height:600px;opacity:.30;}
  #mapbg path{fill:rgba(255,255,255,.07);stroke:rgba(244,241,234,.42);stroke-width:2.4;stroke-linejoin:round;}
  #vig{background:radial-gradient(ellipse 80% 60% at 50% 50%, rgba(0,0,0,0) 38%, rgba(0,0,0,.88) 100%);}
  #grain{mix-blend-mode:overlay;opacity:.5;background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px);}

  /* flag ribbon */
  #ribbon{position:absolute;left:50%;top:596px;width:196px;height:120px;margin-left:-98px;border-radius:9px;
     overflow:hidden;box-shadow:0 16px 54px rgba(0,0,0,.75), 0 0 0 3px rgba(255,255,255,.12);}
  #ribbon div{height:33.34%}
  #ribbon .r{background:var(--red)} #ribbon .w{background:var(--paper)} #ribbon .b{background:#08080A}

  .c{position:absolute;left:56px;right:56px;text-align:center;}
  #big{top:768px;font-family:'Amiri',serif;font-weight:700;font-size:300px;line-height:.94;
     letter-spacing:2px;text-shadow:0 14px 70px rgba(0,0,0,.95), 0 0 130px rgba(206,17,38,.5);}
  #sub{top:1128px;font-family:'Amiri',serif;font-weight:700;font-size:110px;line-height:1.2;
     text-shadow:0 10px 50px rgba(0,0,0,.95);}
  #rule{position:absolute;left:50%;top:1298px;width:230px;height:8px;margin-left:-115px;
     background:var(--red);border-radius:4px;box-shadow:0 0 34px rgba(206,17,38,.85);}
  #tag{top:1348px;font-family:'Cairo';font-weight:900;font-size:46px;letter-spacing:2px;color:rgba(244,241,234,.9);}
</style>
</head>
