<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Blackridge Brokerage monogram">
  <!-- Blackridge Brokerage Inc. — roundel mark: ridge line over a road, gold on ink -->
  <circle cx="32" cy="32" r="31" fill="#0B0E14"/>
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="#C99636" stroke-width="1.1" opacity=".9"/>
  <!-- back ridge (muted) -->
  <path d="M13 41 L22.5 28.5 L28.5 34.5 L37 22 L44 31 L51 41 Z" fill="#232A38"/>
  <!-- front ridge (gold line) -->
  <path d="M12 41 L23 27 L29 33 L38.5 20 L52 41" fill="none" stroke="#C99636" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- peak star -->
  <circle cx="38.5" cy="20" r="1.6" fill="#F6F3EC"/>
  <!-- road -->
  <line x1="16" y1="47.5" x2="48" y2="47.5" stroke="#C99636" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4"/>
</svg>
